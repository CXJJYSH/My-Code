<!DOCTYPE html>

<html>

<head>
    <title>Chatbot</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function App() {
            const [currentTime, setCurrentTime] = React.useState(dayjs().format('YYYY MM D HH:mm:ss'));

            React.useEffect(() => {
                setInterval(() => {
                    setCurrentTime(dayjs().format('YYYY MM D HH:mm:ss'))
                }, 1000)
            }, [])
            // Important: make sure to give React.useEffect() a dependency array of [] so it only runs once.

            return (
                <p>Current time: {currentTime}</p>
            )
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>

<!-- The purpose of this exercise is to see how the dependency array affects how many times useEffect() runs.  -->
<!-- Notice that it runs a lot more often without the dependency array. -->
