<!DOCTYPE html>

<html>

<head>
    <title>Chatbot</title>
    <style>
        body {
            font-family: Arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .send-button {
            background-color: rgb(25, 135, 84);
            color: white;
            padding: 12px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }

        .chat-input {
            padding: 12px 15px;
            border-radius: 10px;
            border-width: 1px;
            font-size: 15px;

            flex-grow: 1;
        }

        .chat-input-container {
            display: flex;
            /* flex-grow = makes an element grow and take up the remaining space */
            margin-bottom: 60px;
        }

        .app-container {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;

            height: 100vh;
            /* vh = viewport height */
            /* (the height of the browser) */
            /* 100vh = 100% of the height of the browser */

            display: flex;
            flex-direction: column;
        }

        .chat-message-user {
            display: flex;
            justify-content: end;
            align-items: start;
        }

        .chat-message-robot {
            display: flex;
            align-items: start;
        }

        .chat-message-text {
            background-color: rgb(238, 238, 238);
            padding: 15px 20px;
            border-radius: 10px;
            margin-right: 10px;
            margin-left: 10px;
            margin-bottom: 20px;
            max-width: 300px;
        }

        .chat-message-profile {
            width: 45px;
        }

        .chat-messages-container {
            flex-grow: 1;
            margin-top: 20px;
            overflow: scroll;
            /* 666，这个overflow演都不演了，直接一键滚动。 */
            scrollbar-width: none;
        }

        .welcome-message {
            color: rgb(120, 120, 120);
            text-align: center;
        }

        .loading-spinner {
            height: 40px;
            margin: -15px;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        // In React, the component name must start with a capital letter.
        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);

            function saveInputText(event) {
                setInputText(event.target.value);
                // event.target = gives us the element that we're typing in
            }

            async function sendMessage() {
                if (isLoading || inputText === '') {
                    return;
                }

                // Set isLoading to true at the start, and set it to false after everything is done.
                setIsLoading(true);

                // We can put this at the top of the function or after the first setChatMessages(). Both work.
                setInputText('');

                const newChatMessages = [
                    ...chatMessages, // Add a new chat message at the end
                    {
                        message: inputText,
                        sender: 'user',
                        id: crypto.randomUUID()
                    }
                ]

                setChatMessages([
                    ...newChatMessages,
                    {
                        message: <img src="loading-spinner.gif" className="loading-spinner" />,
                        sender: 'robot',
                        id: crypto.randomUUID()
                    }
                    // This creates a temporary Loading... message.
                    // Because we don't save this message in newChatMessages,
                    // it will be remove later, when we add the response.
                ]);

                const response = await Chatbot.getResponseAsync(inputText);
                setChatMessages([
                    ...newChatMessages, // Add a new chat message at the end
                    {
                        message: response,
                        sender: 'robot',
                        id: crypto.randomUUID()
                    }
                ]); // New value of chatMessages

                // Set isLoading to false after everything is done.
                setIsLoading(false);
            }

            function handleKeyDown(event) {
                if (event.key === 'Enter') {
                    sendMessage();
                }

                if (event.key === 'Escape') { // 这里不能写Esc，要写Escape。
                    setInputText('');
                }
                // 这里用if或else if都可以。
            }

            return (
                <div
                    className="chat-input-container">
                    <input
                        placeholder="Send a message to Chatbot"
                        size="30"
                        onChange={saveInputText}
                        // onKeyDown={event.key === "Enter" && sendMessage}
                        // 上面这样写不行，下面这样写可以。Simon创建了一个新函数，我也和他一样吧。
                        // onKeyDown={(event) => event.key === "Enter" && sendMessage()}
                        onKeyDown={handleKeyDown}
                        value={inputText}
                        className="chat-input"
                    // onChange = runs a function when we change the text inside an <input>
                    />
                    <button
                        onClick={sendMessage}
                        className="send-button"
                    >Send</button>
                </div>
            )
        }
        // JSX is more strict than normal HTML.
        // All elements need a closing tag.
        // Shortcut for: <input></input>
        // Self-closing element
        // size: character

        function ChatMessage({ message, sender }) {
            // console.log(props); 
            // props = properties
            // Props make our component reusable.

            // const { message, sender } = props;
            // Destructuring

            return (
                <div className={
                    sender === 'user'
                        ? "chat-message-user"
                        : "chat-message-robot"
                }>
                    {sender === 'robot' && (
                        <img src="robot.png" className="chat-message-profile" />
                    )}
                    <div className="chat-message-text">
                        {message}
                    </div>
                    {sender === 'user' && (
                        <img src="user.png" className="chat-message-profile" />
                    )}
                </div>
            )
        }

        // To use a function as a hook, the function name must start with "use".
        function useAutoScroll(dependencies) {
            // It's highly recommend to rename chatMessagesRef to something more generic like containerRef. 
            // This will make the code make more sense if we ever reuse this code in other components.
            const containerRef = React.useRef(null);

            React.useEffect(() => {
                const containerElem = containerRef.current;
                if (containerElem) {
                    containerElem.scrollTop = containerElem.scrollHeight;
                }
            }, dependencies)

            return containerRef;
        }

        // 卧槽，这里自己写一个用了useRef又用了useEffect的hook好绕。
        // 虽然效果是直白的，但是代码就要层层递进好几次，好不直白。

        function ChatMessages({ chatMessages }) {
            const chatMessagesRef = useAutoScroll([chatMessages]);

            return (
                <div
                    className="chat-messages-container"
                    ref={chatMessagesRef}
                >
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        )
                    })}
                </div>
            )
        }

        function App() {
            const [chatMessages, setChatMessages] = React.useState([])
            // Array Destructuring, the order matters
            // const chatMessages = array[0];
            // const setChatMessages = array[1]; // updater function

            return (
                <div
                    className="app-container">
                    {chatMessages.length === 0 && (
                        <p className="welcome-message">
                            Welcome to the chatbot project! Send a message using the textbox below.
                        </p>
                    )}
                    <ChatMessages
                        chatMessages={chatMessages}
                    />
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />
                </div>
            )
        }

        // Component Syntax
        // We're creating our own HTML element.

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
