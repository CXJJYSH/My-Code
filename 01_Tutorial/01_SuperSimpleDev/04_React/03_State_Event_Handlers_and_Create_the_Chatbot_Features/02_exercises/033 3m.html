<!DOCTYPE html>

<html>

<head>
    <title>Chatbot</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        // In React, the component name must start with a capital letter.
        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);

            function saveInputText(event) {
                setInputText(event.target.value);
                // event.target = gives us the element that we're typing in
            }

            async function sendMessage() {
                if (isLoading || inputText === '') {
                    return;
                }

                // Set isLoading to true at the start, and set it to false after everything is done.
                setIsLoading(true);

                // We can put this at the top of the function or after the first setChatMessages(). Both work.
                setInputText('');

                const newChatMessages = [
                    ...chatMessages, // Add a new chat message at the end
                    {
                        message: inputText,
                        sender: 'user',
                        id: crypto.randomUUID()
                    }
                ]

                setChatMessages([
                    ...newChatMessages,
                    {
                        message: 'Loading',
                        sender: 'robot',
                        id: crypto.randomUUID()
                    }
                    // This creates a temporary Loading... message.
                    // Because we don't save this message in newChatMessages,
                    // it will be remove later, when we add the response.
                ]);

                const response = await Chatbot.getResponseAsync(inputText);
                setChatMessages([
                    ...newChatMessages, // Add a new chat message at the end
                    {
                        message: response,
                        sender: 'robot',
                        id: crypto.randomUUID()
                    }
                ]); // New value of chatMessages

                // Set isLoading to false after everything is done.
                setIsLoading(false);
            }

            function handleKeyDown(event) {
                if (event.key === 'Enter') {
                    sendMessage();
                }

                if (event.key === 'Escape') { // 这里不能写Esc，要写Escape。
                    setInputText('');
                }
                // 这里用if或else if都可以。
            }

            return (
                <>
                    <input
                        placeholder="Send a message to Chatbot"
                        size="30"
                        onChange={saveInputText}
                        // onKeyDown={event.key === "Enter" && sendMessage}
                        // 上面这样写不行，下面这样写可以。Simon创建了一个新函数，我也和他一样吧。
                        // onKeyDown={(event) => event.key === "Enter" && sendMessage()}
                        onKeyDown={handleKeyDown}
                        value={inputText}
                    // onChange = runs a function when we change the text inside an <input>
                    />
                    <button onClick={sendMessage}>Send</button>
                </>
            )
        }
        // JSX is more strict than normal HTML.
        // All elements need a closing tag.
        // Shortcut for: <input></input>
        // Self-closing element
        // size: character

        function ChatMessage({ message, sender }) {
            // console.log(props); 
            // props = properties
            // Props make our component reusable.

            // const { message, sender } = props;
            // Destructuring

            return (
                <div>
                    {sender === 'robot' && (
                        <img src="robot.png" width="50" />
                    )}
                    {message}
                    {sender === 'user' && (
                        <img src="user.png" width="50" />
                    )}
                </div>
            )
        }

        function ChatMessages({ chatMessages }) {
            return (
                <>
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        )
                    })}
                </>
            )
        }

        function App() {
            const [chatMessages, setChatMessages] = React.useState([{
                message: 'hello chatbot',
                sender: 'user',
                id: 'id1'
            }, {
                message: 'Hello! How can I help you?',
                sender: 'robot',
                id: 'id2'
            }, {
                message: "Can you get me today's date?",
                sender: 'user',
                id: 'id3'
            }, {
                message: 'Today is September 27',
                sender: 'robot',
                id: 'id4'
            }]);
            // Array Destructuring, the order matters
            // const chatMessages = array[0];
            // const setChatMessages = array[1]; // updater function

            return (
                <>
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />
                    <ChatMessages
                        chatMessages={chatMessages}
                    />
                </>
            )
        }

        // Component Syntax
        // We're creating our own HTML element.

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
