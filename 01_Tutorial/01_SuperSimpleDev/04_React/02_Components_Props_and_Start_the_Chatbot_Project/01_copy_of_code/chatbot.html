<!DOCTYPE html>

<html>

<head>
    <title>Chatbot</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        // In React, the component name must start with a capital letter.
        function ChatInput() {
            return (
                <>
                    <input
                        placeholder="Send a message to Chatbot"
                        size="30"
                    />
                    <button>Send</button>
                </>
            )
        }
        // JSX is more strict than normal HTML.
        // All elements need a closing tag.
        // Shortcut for: <input></input>
        // Self-closing element
        // size: character

        function ChatMessage({ message, sender }) {
            // console.log(props); 
            // props = properties
            // Props make our component reusable.

            // const { message, sender } = props;
            // Destructuring

            return (
                <div>
                    {sender === 'robot' && (
                        <img src="robot.png" width="50" />
                    )}
                    {message}
                    {sender === 'user' && (
                        <img src="user.png" width="50" />
                    )}
                </div>
            )
        }

        function App() {
            return (
                <>
                    <ChatInput />
                    <ChatMessage
                        message="hello chatbot"
                        sender="user"
                    />
                    <ChatMessage
                        message="Hello! How can I help you?"
                        sender="robot"
                    />
                    <ChatMessage
                        message="can you get me today's date?"
                        sender="user"
                    />
                    <ChatMessage
                        message="Today is September 27"
                        sender="robot"
                    />
                </>
            )
        }

        // Component Syntax
        // We're creating our own HTML element.

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
